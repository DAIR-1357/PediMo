<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedimo - Versiones del logo</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef1f6;color:#1d2430;padding:24px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:#6b7280;margin:0 0 24px;font-size:.9rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;border:1px solid #d9dee8;overflow:hidden}
.card h2{font-size:.9rem;margin:0 0 16px;align-self:flex-start;opacity:.7;font-weight:600}
.light{background:#ffffff;color:#1d2430}
.dark{background:#0b1220;color:#e6e8ec;border-color:#1f2937}
.mono{background:#f3f4f6;color:#000;border-color:#d1d5db}
.full{grid-column:1/-1}
.card svg{max-width:100%;height:auto;display:block}
</style>
</head>
<body>

<h1>Pedimo: versiones del logo</h1>
<p class="sub">Las cinco versiones sobre fondo claro, oscuro y monocromático.</p>

<div class="grid" id="grid"></div>

<script>
const NAVY = "#0B1F4B", BLUE = "#1E7BFF", WHITE = "#FFFFFF", BLACK = "#000000";

// Icono cuadrado: fondo, color de la P, color de las líneas de velocidad
function icon(bg, fg, acc) {
  return `
    <rect width="200" height="200" rx="40" fill="${bg}"/>
    <rect x="44" y="78" width="44" height="11" rx="5.5" fill="${acc}"/>
    <rect x="56" y="100" width="36" height="11" rx="5.5" fill="${acc}"/>
    <path fill="${fg}" fill-rule="evenodd"
      d="M88 42 H128 A36 36 0 0 1 128 114 H110 V158 H88 Z M110 62 H124 A14 14 0 0 1 124 90 H110 Z"/>`;
}

// Texto "PediMo" con ancho fijo para que nunca se corte
function wordmark(x, y, size, width, c1, c2) {
  return `<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-weight="800"
    font-size="${size}" textLength="${width}" lengthAdjust="spacingAndGlyphs"><tspan fill="${c1}">Pedi</tspan><tspan fill="${c2}">Mo</tspan></text>`;
}

// 1. Horizontal
const horizontal = (dark) => `
  <svg viewBox="0 0 560 200" width="480" role="img" aria-label="Pedimo">
    ${icon(NAVY, WHITE, BLUE)}
    ${wordmark(225, 135, 110, 310, dark ? WHITE : NAVY, BLUE)}
  </svg>`;

// 2. Apilado
const stacked = (dark) => `
  <svg viewBox="0 0 300 340" width="200" role="img" aria-label="Pedimo">
    <g transform="translate(50,0)">${icon(NAVY, WHITE, BLUE)}</g>
    ${wordmark(20, 318, 92, 260, dark ? WHITE : NAVY, BLUE)}
  </svg>`;

// 3. Solo icono
const iconOnly = (w) => `
  <svg viewBox="0 0 200 200" width="${w}" role="img" aria-label="Icono Pedimo">
    ${icon(NAVY, WHITE, BLUE)}
  </svg>`;

// 4. Monocromático (un solo color, para tickets y bolsas)
const mono = `
  <svg viewBox="0 0 560 200" width="300" role="img" aria-label="Pedimo monocromático">
    ${icon(BLACK, WHITE, WHITE)}
    ${wordmark(225, 135, 110, 310, BLACK, BLACK)}
  </svg>`;

const cards = [
  { cls: "light full", title: "1. Logo completo horizontal (fondo claro)", svg: horizontal(false) },
  { cls: "dark full",  title: "1b. Logo completo horizontal (fondo oscuro)", svg: horizontal(true) },
  { cls: "light",      title: "2. Logo apilado (fondo claro)", svg: stacked(false) },
  { cls: "dark",       title: "2b. Logo apilado (fondo oscuro)", svg: stacked(true) },
  { cls: "light",      title: "3. Icono simplificado", svg: iconOnly(140) },
  { cls: "dark",       title: "3b. Icono en tamaño pequeño (48 px)", svg: iconOnly(48) },
  { cls: "mono",       title: "4. Monocromática (tickets, bolsas)", svg: mono },
  { cls: "dark",       title: "5. Versión para fondo oscuro (horizontal)", svg: horizontal(true) }
];

document.getElementById("grid").innerHTML = cards.map(c => `
  <div class="card ${c.cls}">
    <h2>${c.title}</h2>
    ${c.svg}
  </div>`).join("");
</script>

</body>
</html>
